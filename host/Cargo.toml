[package]
name = "horizonx"
version = "0.3.5"
edition = "2021"
license = "MIT"
description = "Make a Minecraft server on HorizonsX in a few clicks; friends join from anywhere with no port forwarding"

[[bin]]
# HorizonX.exe
name = "HorizonX"
path = "src/main.rs"

[workspace]

[dependencies]
# The launcher's GPUI (GPUI Fast), so the lifted scene, glass and sky draw the same.
gpui = { package = "gpui-fast", version = "0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["wayland", "x11", "font-kit"] }
# The launcher's tokens, fonts and icons.
horizon-theme = { path = "../vendor/horizon/crates/horizon-theme" }
# Servers (horizon-server), versions, preparing, HorizonsX, playit, plugins: the forked launcher's library.
horizonx-core = { path = "../app" }
serde_json = "1"
# `HorizonX mcp`: the Model Context Protocol, shared with horizon-server and the launcher.
horizon-mcp = { path = "../vendor/horizon/crates/horizon-mcp" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `HORIZONX_LOG=info` (or debug, warn...): the app's and the renderer's messages on stderr, for a problem report.
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSAppearance", "NSView", "NSWindow", "NSWorkspace"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
