[package]
name = "ajleaderboards"
version = "2.11.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-bukkit = { path = "../../../sdk/horizon-bukkit" }
horizon-kit = { path = "../horizon-kit" }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "unwind"
opt-level = 3
codegen-units = 4

[workspace]
