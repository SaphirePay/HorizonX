[package]
name = "mcmmo_rs"
version = "2.3.3"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "mcMMO (GPL-3.0, mcMMO-Dev) rewritten natively in Rust for Horizon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-bukkit = { path = "../../../sdk/horizon-bukkit" }
horizon-kit = { path = "../horizon-kit" }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace]
