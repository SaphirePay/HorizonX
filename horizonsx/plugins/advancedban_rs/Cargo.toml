[package]
name = "advancedban"
version = "2.3.0"
edition = "2024"
publish = false
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-bukkit = { path = "../../../sdk/horizon-bukkit" }
horizon-kit = { path = "../horizon-kit" }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", default-features = false }

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace]
