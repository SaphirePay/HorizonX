[package]
name = "horizonboard"
version = "1.0.0"
edition = "2024"
publish = false
description = "A professional sidebar scoreboard and tab list for Horizon servers, native Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-bukkit = { path = "../../../sdk/horizon-bukkit" }
horizon-kit = { path = "../horizon-kit" }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"

[profile.release]
panic = "unwind"
opt-level = 3
codegen-units = 4

[workspace]
