[package]
name = "chestshop_rs"
version = "3.12.2"
edition = "2024"
publish = false
license = "LGPL-2.1-or-later"
description = "ChestShop for Horizon, written in Rust: the same shop signs, config.yml, languages and commands."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-bukkit = { path = "../../../sdk/horizon-bukkit" }
horizon-kit = { path = "../horizon-kit" }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace]
