# HorizonJobs: five jobs, each with its own levels and pay.
# `/jobs admin reload` reads this file again (no restart).

# How many jobs a player can have at once. A rank can raise it: lp group vip meta set horizonjobs.max-jobs 2
max-jobs: 1
# Leaving a job keeps its level and exp (joining it again carries on). false = leaving starts it over.
keep-progress-on-leave: true
# Minutes after leaving a job before a player may join another one (stops job hopping). Staff skip it.
join-cooldown-minutes: 5
# Money is paid in one go every few seconds (one economy call, not one a block).
pay-every-seconds: 3
# Each level above 1 pays this much more (0.02 = +2% a level: level 50 pays 98% more).
income-per-level: 0.02
# Mobs from spawners pay this share (0 = nothing, 1 = full).
spawner-multiplier: 0.25
# Server-wide extra pay in percent (an event weekend: 50). Ranks add theirs: lp group vip meta set horizonjobs.boost 10
boost-percent: 0
# Players in creative earn nothing.
creative-earns: false

level-up:
  # Money for reaching a level: this times the new level (level 10 = $500).
  money-per-level: 50
  # Tell the whole server every this many levels (0 = never).
  announce-every: 10

# Each job: how it looks in /jobs and what pays. A payout is `thing: [money, exp]`; several things can share one
# line, split by commas. Sections: break (blocks), kill (mobs), fish (caught items), breed (animals),
# harvest (right-click harvest items such as sweet berries).
# Exp for the next level = base-exp * (1 + exp-step * (level - 1)).
jobs:
  miner:
    name: Miner
    plural: Miners
    color: '#a78bfa'
    light: '#ddd6fe'
    icon: DIAMOND_PICKAXE
    description:
      - This job requires you to explore the
      - caves and mine ores to earn money.
    base-exp: 1100
    exp-step: 0.35
    max-level: 100
    break:
      coal_ore, deepslate_coal_ore: [1.0, 8]
      copper_ore, deepslate_copper_ore: [0.8, 6]
      iron_ore, deepslate_iron_ore: [2.0, 14]
      gold_ore, deepslate_gold_ore: [3.0, 18]
      redstone_ore, deepslate_redstone_ore: [1.5, 10]
      lapis_ore, deepslate_lapis_ore: [2.5, 16]
      diamond_ore, deepslate_diamond_ore: [12.0, 60]
      emerald_ore, deepslate_emerald_ore: [15.0, 70]
      nether_quartz_ore: [1.2, 8]
      nether_gold_ore: [1.2, 8]
      ancient_debris: [25.0, 120]
      amethyst_cluster: [1.0, 6]
      stone, deepslate, tuff: [0.05, 0.5]
      granite, diorite, andesite, calcite: [0.05, 0.5]
      netherrack, blackstone, basalt, end_stone: [0.03, 0.3]
      obsidian: [0.5, 4]

  lumberjack:
    name: Lumberjack
    plural: Lumberjacks
    color: '#c69c7b'
    light: '#ead7c3'
    icon: IRON_AXE
    description:
      - This job requires you to chop down trees
      - and harvest their leaves to earn money.
    base-exp: 580
    exp-step: 0.35
    max-level: 100
    break:
      oak_log, birch_log, spruce_log: [0.6, 5]
      jungle_log, acacia_log, dark_oak_log: [0.6, 5]
      mangrove_log, cherry_log, pale_oak_log: [0.7, 5.5]
      crimson_stem, warped_stem: [0.7, 5.5]
      oak_wood, birch_wood, spruce_wood, jungle_wood, acacia_wood, dark_oak_wood: [0.6, 5]
      mangrove_roots: [0.2, 1.5]
      oak_leaves, birch_leaves, spruce_leaves, jungle_leaves: [0.05, 0.6]
      acacia_leaves, dark_oak_leaves, mangrove_leaves: [0.05, 0.6]
      cherry_leaves, azalea_leaves, flowering_azalea_leaves, pale_oak_leaves: [0.05, 0.6]
      nether_wart_block, warped_wart_block, shroomlight: [0.1, 1]

  farmer:
    name: Farmer
    plural: Farmers
    color: '#55ff55'
    light: '#bbffbb'
    icon: GOLDEN_HOE
    description:
      - This job requires you to harvest crops
      - and breed barn animals to earn money.
    base-exp: 1144
    exp-step: 0.35
    max-level: 100
    # Crops pay only when fully grown.
    break:
      wheat: [0.6, 4]
      carrots: [0.6, 4]
      potatoes: [0.6, 4]
      beetroots: [0.7, 5]
      nether_wart: [0.8, 5]
      cocoa: [0.8, 5]
      melon: [0.5, 3]
      pumpkin: [0.8, 5]
      sugar_cane: [0.2, 1.5]
      cactus: [0.2, 1.5]
      bamboo: [0.05, 0.5]
      torchflower_crop, pitcher_crop: [1.0, 6]
    harvest:
      sweet_berries: [0.3, 2]
      glow_berries: [0.3, 2]
    breed:
      cow, mooshroom: [2.0, 15]
      sheep: [2.0, 15]
      pig: [2.0, 15]
      chicken: [1.5, 10]
      rabbit: [1.5, 10]
      goat: [2.5, 16]
      horse, donkey, llama, camel: [3.0, 20]
      bee, turtle, frog, armadillo, sniffer: [3.0, 20]

  fisher:
    name: Fisher
    plural: Fishers
    color: '#55ffff'
    light: '#c4ffff'
    icon: FISHING_ROD
    description:
      - This job requires you to explore the
      - oceans and fish to earn money.
    base-exp: 220
    exp-step: 0.35
    max-level: 100
    fish:
      cod: [3.0, 20]
      salmon: [4.0, 25]
      tropical_fish: [6.0, 35]
      pufferfish: [5.0, 30]
      enchanted_book, name_tag, saddle, nautilus_shell: [10.0, 50]
      bow, fishing_rod: [6.0, 30]
      lily_pad, bone, string, stick, leather, leather_boots, rotten_flesh, bowl, ink_sac, tripwire_hook, bamboo: [1.0, 6]

  hunter:
    name: Hunter
    plural: Hunters
    color: '#ff5555'
    light: '#ffb3b3'
    icon: IRON_SWORD
    description:
      - This job requires you to hunt down and
      - slaughter monsters to earn money.
    base-exp: 400
    exp-step: 0.35
    max-level: 100
    kill:
      zombie, husk, zombie_villager: [2.0, 12]
      drowned: [2.5, 14]
      skeleton, stray, bogged: [2.5, 14]
      spider, cave_spider: [2.0, 12]
      creeper: [3.0, 16]
      enderman: [5.0, 25]
      witch: [5.0, 25]
      slime, magma_cube: [0.5, 3]
      phantom: [4.0, 20]
      pillager: [4.0, 20]
      vindicator: [6.0, 30]
      evoker: [15.0, 60]
      ravager: [25.0, 100]
      guardian: [5.0, 25]
      elder_guardian: [100.0, 400]
      blaze: [5.0, 25]
      ghast: [8.0, 35]
      wither_skeleton: [8.0, 35]
      piglin_brute: [10.0, 40]
      hoglin: [4.0, 20]
      zoglin: [5.0, 25]
      zombified_piglin: [1.5, 8]
      shulker: [6.0, 30]
      silverfish, endermite: [0.5, 3]
      breeze: [8.0, 35]
      warden: [150.0, 600]
      wither: [300.0, 1200]
      ender_dragon: [500.0, 2000]
