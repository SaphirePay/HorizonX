name: HorizonJobs
version: '1.0.0'
main: dev.horizon.jobs.HorizonJobs
api-version: '1.21'
folia-supported: true
description: 'Jobs: Miner, Lumberjack, Farmer, Fisher, Hunter with levels, pay and menus (native Rust)'
softdepend: [Essentials, LuckPerms, Vault]
# `horizonjobs.player` (everyone) holds the player nodes, so `lp group default permission set horizonjobs.top false`
# takes one feature away. Per-job join rights: horizonjobs.join.<job> (all true by default).
# Rank perks (LuckPerms meta): horizonjobs.max-jobs (how many jobs at once), horizonjobs.boost (extra pay in %).
commands:
  jobs:
    description: Jobs menu, join and leave jobs, payouts and top workers
    aliases: [job, horizonjobs]
    permission: horizonjobs.use
permissions:
  horizonjobs.player:
    description: Everything a player uses
    default: true
    children:
      horizonjobs.use: true
      horizonjobs.join: true
      horizonjobs.join.*: true
      horizonjobs.top: true
      horizonjobs.stats: true
      horizonjobs.stats.others: true
  horizonjobs.use: { description: "/jobs (the menu, payouts)", default: true }
  horizonjobs.join: { description: "Join and leave jobs", default: true }
  horizonjobs.join.*: { description: "Join any job", default: true }
  horizonjobs.top: { description: "/jobs top", default: true }
  horizonjobs.stats: { description: "/jobs stats", default: true }
  horizonjobs.stats.others: { description: "/jobs stats <player>", default: true }
  horizonjobs.admin:
    description: Staff commands (/jobs admin ...)
    default: op
