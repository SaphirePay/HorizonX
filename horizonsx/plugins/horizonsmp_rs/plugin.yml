name: HorizonSMP
version: '1.0.0'
main: dev.horizon.smp.HorizonSMP
api-version: '1.21'
description: 'The SMP core: land claims, shop, crates, teams, rewards, combat, bounties, stats and the server menu (native Rust)'
softdepend: [Essentials, LuckPerms, Vault]
# Every command has its own node. `horizonsmp.player` (default: everyone) holds all the player nodes, so
# `lp group default permission set horizonsmp.shop false` takes just the shop away; `horizonsmp.admin` (ops)
# holds the staff ones. Rank perks come from LuckPerms meta (see config.yml, "Rank perks").
commands:
  menu:
    description: Open the server menu
    aliases: [smp, servermenu]
    permission: horizonsmp.menu
  claim:
    description: Land claims
    aliases: [claims, land]
    permission: horizonsmp.claims
  trust:
    description: Trust a player in your claim
    permission: horizonsmp.claims.trust
  untrust:
    description: Remove a player's trust from your claim
    permission: horizonsmp.claims.trust
  unclaim:
    description: Delete the claim you are standing in
    permission: horizonsmp.claims
  shop:
    description: Open the server shop
    aliases: [market]
    permission: horizonsmp.shop
  sell:
    description: Sell items to the server
    permission: horizonsmp.sell
  worth:
    description: See what an item sells for
    permission: horizonsmp.worth
  crate:
    description: Crates and keys
    aliases: [crates, keys]
    permission: horizonsmp.crates
  team:
    description: Teams
    aliases: [teams, t, clan]
    permission: horizonsmp.teams
  tc:
    description: Team chat
    aliases: [teamchat]
    permission: horizonsmp.teams.chat
  daily:
    description: Claim your daily reward
    permission: horizonsmp.daily
  rewards:
    description: Playtime rewards
    aliases: [playtimerewards]
    permission: horizonsmp.rewards
  playtime:
    description: How long you have played
    aliases: [pt]
    permission: horizonsmp.playtime
  pvp:
    description: Your PvP protection
    permission: horizonsmp.pvp
  bounty:
    description: Bounties
    aliases: [bounties]
    permission: horizonsmp.bounty
  stats:
    description: Player statistics
    aliases: [profile]
    permission: horizonsmp.stats
  top:
    description: Leaderboards
    aliases: [leaderboard, leaderboards, lb]
    permission: horizonsmp.top
  rules:
    description: The server rules
    permission: horizonsmp.rules
  horizonsmp:
    description: HorizonSMP admin
    aliases: [hsmp]
    permission: horizonsmp.admin.command
permissions:
  # ---- Players ----
  horizonsmp.player:
    description: Everything a player uses (all the nodes below)
    default: true
    children:
      horizonsmp.menu: true
      horizonsmp.claims: true
      horizonsmp.claims.create: true
      horizonsmp.claims.trust: true
      horizonsmp.claims.buyblocks: true
      horizonsmp.claims.tool: true
      horizonsmp.shop: true
      horizonsmp.shop.buy: true
      horizonsmp.shop.sell: true
      horizonsmp.sell: true
      horizonsmp.worth: true
      horizonsmp.crates: true
      horizonsmp.crates.open: true
      horizonsmp.teams: true
      horizonsmp.teams.create: true
      horizonsmp.teams.chat: true
      horizonsmp.teams.home: true
      horizonsmp.daily: true
      horizonsmp.rewards: true
      horizonsmp.playtime: true
      horizonsmp.playtime.others: true
      horizonsmp.pvp: true
      horizonsmp.bounty: true
      horizonsmp.bounty.set: true
      horizonsmp.stats: true
      horizonsmp.stats.others: true
      horizonsmp.top: true
      horizonsmp.rules: true
  horizonsmp.menu: { description: "/menu", default: true }
  horizonsmp.claims: { description: "/claim (menu, info, list, show) and /unclaim", default: true }
  horizonsmp.claims.create: { description: "Claim land (shovel or /claim create) and resize claims", default: true }
  horizonsmp.claims.trust: { description: "/trust and /untrust", default: true }
  horizonsmp.claims.buyblocks: { description: "Buy claim blocks with money", default: true }
  horizonsmp.claims.tool: { description: "Get a claim shovel from the claims menu", default: true }
  horizonsmp.shop: { description: "/shop", default: true }
  horizonsmp.shop.buy: { description: "Buy from the shop", default: true }
  horizonsmp.shop.sell: { description: "Sell in the shop menus", default: true }
  horizonsmp.sell: { description: "/sell (hand, all, sell chest)", default: true }
  horizonsmp.worth: { description: "/worth", default: true }
  horizonsmp.crates: { description: "/crates (list and preview)", default: true }
  horizonsmp.crates.open: { description: "Open crates with keys", default: true }
  horizonsmp.teams: { description: "/team", default: true }
  horizonsmp.teams.create: { description: "Found a team", default: true }
  horizonsmp.teams.chat: { description: "/tc team chat", default: true }
  horizonsmp.teams.home: { description: "/team home", default: true }
  horizonsmp.daily: { description: "/daily", default: true }
  horizonsmp.rewards: { description: "/rewards (playtime rewards)", default: true }
  horizonsmp.playtime: { description: "/playtime", default: true }
  horizonsmp.playtime.others: { description: "/playtime <player>", default: true }
  horizonsmp.pvp: { description: "/pvp", default: true }
  horizonsmp.bounty: { description: "/bounty (wanted list, check)", default: true }
  horizonsmp.bounty.set: { description: "Put a bounty on someone", default: true }
  horizonsmp.stats: { description: "/stats", default: true }
  horizonsmp.stats.others: { description: "/stats <player>", default: true }
  horizonsmp.top: { description: "/top", default: true }
  horizonsmp.rules: { description: "/rules", default: true }
  # ---- Staff ----
  horizonsmp.admin:
    description: Every staff node below
    default: op
    children:
      horizonsmp.admin.command: true
      horizonsmp.reload: true
      horizonsmp.claims.admin: true
      horizonsmp.crates.admin: true
      horizonsmp.shop.admin: true
      horizonsmp.combat.bypass: true
  horizonsmp.admin.command: { description: "/horizonsmp", default: op }
  horizonsmp.reload: { description: "/horizonsmp reload", default: op }
  horizonsmp.claims.admin: { description: "/claim bypass, server land (/claim admin), /claim giveblocks, delete any claim", default: op }
  horizonsmp.crates.admin: { description: "/crate give, giveall, set, remove, list, reload", default: op }
  horizonsmp.shop.admin: { description: "/shop reload", default: op }
  horizonsmp.combat.bypass: { description: "Not tagged in combat, may use any command and log out in a fight", default: false }
