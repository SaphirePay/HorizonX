# ZenithBackpacks — row progression 1–6, YAML storage, optional Vault costs

starting-rows: 1
max-rows: 6

# Physical item. Default CHEST avoids vanilla PLAYER_HEAD “wear on right-click air” stealing the event.
# Set material: PLAYER_HEAD and optional texture if you still want a skull (interaction is still cancelled).
item:
  material: CHEST
  # Only used when material is PLAYER_HEAD — single-field skull texture blob, or leave empty
  texture: ""
  # Per-tier art from the server resource pack. The row count is appended, so
  # this resolves to zbackpacks:backpack_tier1 .. backpack_tier6 and the pack
  # visibly changes each time it is upgraded. Leave empty to keep the plain
  # material at every tier; clients without the pack see the material anyway.
  model-key: "zbackpacks:backpack_tier"

# The tier icons above (and chest.item.model-key) live in this resource pack, sent to every player when they
# join. It holds only the backpack and vault chest icons, and goes on top of any other server pack. Clear url to
# send nothing (when your own server pack already carries the zbackpacks icons).
resource-pack:
  url: "http://your-server.example:8081/zenithbackpacks-pack.zip"
  sha1: "04513899aae8bae76aeff53d99f24d48732ee3dd"
  required: false
  prompt: "<gray>ᴢᴇɴɪᴛʜ</gray> <white>ʙᴀᴄᴋᴘᴀᴄᴋ ɪᴄᴏɴꜱ</white> <dark_gray>·</dark_gray> <gray>ꜱᴍᴀʟʟ ᴅᴏᴡɴʟᴏᴀᴅ</gray>"

# Worlds where the backpack item does nothing (names as in /world, leave empty to allow all)
world-blacklist: []

# Block opening / upgrading while in creative
block-in-creative: false

# Bukkit Sound enum names, or omit to silence
sounds:
  open: ENTITY_ENDER_CHEST_OPEN
  upgrade-success: ENTITY_PLAYER_LEVELUP

# Upgrade steps: each defines target `rows` (2–6) and `requirements` (permission / money / playtime).
# Steps are evaluated in row order; the next row above current stored rows is offered.
# Paid upgrades need Vault + an economy plugin registered with Vault.
upgrades:
  - rows: 2
    requirements:
      - type: money
        amount: 500
  - rows: 3
    requirements:
      - type: money
        amount: 2500
      - type: playtime
        minutes: 60
  - rows: 4
    requirements:
      - type: money
        amount: 10000
  - rows: 5
    requirements:
      - type: money
        amount: 25000
  - rows: 6
    requirements:
      - type: money
        amount: 50000

# Optional: gate max visible rows with LuckPerms (zenithbackpacks.rows.N). Highest N wins; if none
# are granted, config max-rows is used. See plugin.yml defaults.

chest:
  enabled: true
  starting-pages: 1
  max-pages: 3
  item:
    material: CHEST
    # Per-tier art. The page count is appended, giving
    # zbackpacks:vault_chest_tier1 .. tier3. Leave empty for the plain block.
    model-key: "zbackpacks:vault_chest_tier"
  upgrades:
    - pages: 2
      requirements:
        - type: money
          amount: 25000
    - pages: 3
      requirements:
        - type: money
          amount: 100000
