# MiniMessage — PrivateVaults-style (see PrivateVaults gui.yml)
# Placeholders: <rows>, <max>, <slots>, <maxslots>, <eff> (storage title only)

item:
  # Display name only. The tier and slot counts live in the lore stat block
  # below, so repeating them here just says everything twice.
  name-progress: "<gradient:#5DADE2:#1ABC9C><bold>ᴢᴇɴɪᴛʜ ʙᴀᴄᴋᴘᴀᴄᴋ</bold></gradient>"
  name-maxed: "<gradient:#5DADE2:#1ABC9C><bold>ᴢᴇɴɪᴛʜ ʙᴀᴄᴋᴘᴀᴄᴋ</bold></gradient>"
  lore-progress:
    - "<light_purple>|</light_purple> <gray>ᴛɪᴇʀ:</gray> <white><rows></white><dark_gray>/</dark_gray><gray><max></gray> <dark_gray>ʀᴏᴡꜱ</dark_gray>"
    - "<light_purple>|</light_purple> <gray>ᴄᴀᴘᴀᴄɪᴛʏ:</gray> <white><slots></white> <dark_gray>ꜱʟᴏᴛꜱ</dark_gray>"
    - "<spacer>"
    - "<dark_gray>❙</dark_gray> <white>ʀɪɢʜᴛ‑ᴄʟɪᴄᴋ</white> <dark_gray>·</dark_gray> <gray>ᴏᴘᴇɴ ꜱᴛᴏʀᴀɢᴇ</gray>"
    - "<dark_gray>❙</dark_gray> <white>ꜱʜɪꜰᴛ + ʀɪɢʜᴛ‑ᴄʟɪᴄᴋ</white> <dark_gray>·</dark_gray> <aqua>ᴜᴘɢʀᴀᴅᴇ ꜱɪᴢᴇ</aqua>"
  lore-maxed:
    - "<light_purple>|</light_purple> <gray>ᴛɪᴇʀ:</gray> <gold><bold>ᴍᴀx</bold></gold>"
    - "<light_purple>|</light_purple> <gray>ᴄᴀᴘᴀᴄɪᴛʏ:</gray> <white><slots></white> <dark_gray>ꜱʟᴏᴛꜱ</dark_gray> <dark_gray>(ꜰᴜʟʟ)</dark_gray>"
    - "<spacer>"
    - "<dark_gray>❙</dark_gray> <white>ʀɪɢʜᴛ‑ᴄʟɪᴄᴋ</white> <dark_gray>·</dark_gray> <gray>ᴏᴘᴇɴ ꜱᴛᴏʀᴀɢᴇ</gray>"
    - "<dark_gray>❙</dark_gray> <gold><bold>ᴍᴀx ᴛɪᴇʀ</bold></gold> <dark_gray>·</dark_gray> <gray>ɴᴏ ꜰᴜʀᴛʜᴇʀ ᴜᴘɢʀᴀᴅᴇꜱ</gray>"

backpack:
  title-progress: "<gradient:#5DADE2:#1ABC9C><bold>ʙᴀᴄᴋᴘᴀᴄᴋ</bold></gradient> <dark_gray>·</dark_gray> <white><rows></white><gray>/</gray><white><max></white> <gray>ʀᴏᴡꜱ</gray> <dark_gray>(</dark_gray><white><eff></white> <gray>ꜱʜᴏᴡɴ</gray><dark_gray>)</dark_gray>"
  title-maxed: "<gradient:#5DADE2:#1ABC9C><bold>ʙᴀᴄᴋᴘᴀᴄᴋ</bold></gradient> <dark_gray>·</dark_gray> <white><rows></white><dark_gray>/</dark_gray><gray><max></gray> <gold><bold>ᴍᴀx</bold></gold>"

upgrade:
  title: "<gradient:#5DADE2:#1ABC9C><bold>ᴜᴘɢʀᴀᴅᴇ</bold></gradient> <dark_gray>·</dark_gray> <gray>ᴢᴇɴɪᴛʜ ʙᴀᴄᴋᴘᴀᴄᴋ</gray>"
  banner: "<gradient:#5DADE2:#1ABC9C><bold>ᴄᴏɴꜰɪʀᴍ ᴜᴘɢʀᴀᴅᴇ</bold></gradient>"
  labels:
    current: "ᴄᴜʀʀᴇɴᴛ ᴛɪᴇʀ"
    new-tier: "ɴᴇᴡ ᴛɪᴇʀ"
    cost: "ᴄᴏꜱᴛ"
  # Smithing table + arrow: cleaner than dyed concrete; still overridable
  confirm-material: SMITHING_TABLE
  confirm-name: "<gradient:#5DADE2:#1ABC9C><bold>✔ ᴀᴘᴘʀᴏᴠᴇ</bold></gradient> <dark_gray>·</dark_gray> <green>ᴜᴘɢʀᴀᴅᴇ</green>"
  confirm-hint: "<dark_gray>❙</dark_gray> <gradient:#F4D03F:#F39C12>ʟᴇꜰᴛ‑ᴄʟɪᴄᴋ</gradient> <dark_gray>·</dark_gray> <green>ᴘᴀʏ ᴀɴᴅ ᴄᴏɴꜰɪʀᴍ</green> <dark_gray>·</dark_gray> <italic><gray>ᴄᴏɴꜰɪɢ ᴄᴏꜱᴛꜱ ᴀᴘᴘʟʏ</gray></italic>"
  cancel-material: ARROW
  cancel-name: "<gray><bold>◀ ʀᴇᴛᴜʀɴ</bold></gray> <dark_gray>·</dark_gray> <red>ᴄᴀɴᴄᴇʟ</red>"
  cancel-lore:
    - "<dark_gray><strikethrough>            </strikethrough></dark_gray> <red><bold>ᴄᴀɴᴄᴇʟ</bold></red> <dark_gray><strikethrough>            </strikethrough></dark_gray>"
    - "<gray>ʟᴇᴀᴠᴇ ᴡɪᴛʜᴏᴜᴛ ᴘᴀʏɪɴɢ</gray>"
    - "<spacer>"
    - "<dark_gray>❙</dark_gray> <gradient:#F4D03F:#F39C12>ʟᴇꜰᴛ‑ᴄʟɪᴄᴋ</gradient> <dark_gray>·</dark_gray> <italic><red>ɴᴏ ᴄʜᴀʀɢᴇ</red></italic>"

shared:
  filler-pane: GRAY_STAINED_GLASS_PANE

chest:
