name: ZenithBackpacks
main: com.zenithbackpacks.ZenithBackpacksPlugin
version: 1.0.0
description: Zenith-style physical backpack item with 1–6 row progression and Vault upgrades.
api-version: "1.21"
authors: [ Zenith ]
softdepend:
  - Vault

commands:
  zenithbackpacks:
    description: How to use the Zenith backpack item
    usage: /<command> [help]
    aliases: [ zbpack, zbackpack ]
  zenithbackpacksadmin:
    description: Admin reload, give backpack, give vault chest, purge orphans
    usage: /<command> reload|give <player>|givechest <player>|chestpurge <days> [--confirm]
    permission: zenithbackpacks.admin

permissions:
  zenithbackpacks.use:
    description: Use the backpack item (open / shift-upgrade)
    default: true
  zenithbackpacks.upgrade:
    description: Pay for row upgrades from the item
    default: true
  zenithbackpacks.admin:
    description: Reload configs and give backpack items
    default: op
  zenithbackpacks.chest.bypass:
    description: Open and reclaim any player's vault chest
    default: op
  zenithbackpacks.bypass:
    description: Skip money/permission/playtime requirement checks (not row caps)
    default: op
  zenithbackpacks.rows.1:
    description: Row ceiling 1 (LuckPerms ladder example)
    default: false
  zenithbackpacks.rows.2:
    description: Row ceiling 2
    default: false
  zenithbackpacks.rows.3:
    description: Row ceiling 3
    default: false
  zenithbackpacks.rows.4:
    description: Row ceiling 4
    default: false
  zenithbackpacks.rows.5:
    description: Row ceiling 5
    default: false
  zenithbackpacks.rows.6:
    description: Row ceiling 6 (no extra limit when granted)
    default: true
