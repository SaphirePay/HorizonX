[package]
name = "essentials-xmpp"
version = "2.22.0"
edition = "2024"
publish = false
# A port of part of EssentialsX 2.22.0, which is GPL-3.0: see ../essentials/NOTICE.
license = "GPL-3.0-only"
description = "Provides XMPP communication"

[lib]
crate-type = ["rlib"]

[dependencies]
essentials = { path = "../essentials", default-features = false }
horizon-bukkit = { path = "../../../../sdk/horizon-bukkit" }
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"

[workspace]
