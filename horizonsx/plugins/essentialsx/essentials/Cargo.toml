[package]
name = "essentials"
version = "2.22.0"
edition = "2024"
publish = false
# A port of EssentialsX 2.22.0, which is GPL-3.0: see NOTICE and LICENSE.
license = "GPL-3.0-only"
description = "EssentialsX 2.22.0 rewritten in Rust for Horizon, on horizon-bukkit"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The plugin's own entry point. `essentials-bundle` turns it off and has its own, which starts this
# crate and the modules: see GAPS.md for why they're one library.
default = ["plugin"]
plugin = []

[dependencies]
horizon-bukkit = { path = "../../../../sdk/horizon-bukkit" }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
regex = "1"
num-bigint = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
num-traits = "0.2"
num-integer = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
panic = "unwind"

[workspace]
