[package]
name = "essentials-geoip"
version = "2.22.0"
edition = "2024"
publish = false
# A port of part of EssentialsX 2.22.0, which is GPL-3.0: see ../essentials/NOTICE.
license = "GPL-3.0-only"
description = "Where a player joined from"

[lib]
crate-type = ["rlib"]

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }
flate2 = "1"
essentials = { path = "../essentials", default-features = false }
horizon-bukkit = { path = "../../../../sdk/horizon-bukkit" }
serde_json = "1"

[workspace]
