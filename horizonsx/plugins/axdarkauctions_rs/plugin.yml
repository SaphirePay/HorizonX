name: AxDarkAuctions
version: '1.12.1'
main: com.artillexstudios.axdarkauctions.AxDarkAuctions
api-version: '1.20'
folia-supported: true
description: Dark auctions with bidding, NPCs and schedules (native Rust)
authors: [Artillex Studios]
softdepend: [PlaceholderAPI, Essentials, Vault]
commands:
  axdarkauctions:
    description: Dark auctions
    usage: /axdarkauctions help
    aliases: [axda, da, darkauctions, darkauction]
permissions:
  axdarkauctions.use:
    default: true
  axdarkauctions.admin:
    default: op
  axdarkauctions.create:
    default: op
  axdarkauctions.delete:
    default: op
  axdarkauctions.editor:
    default: op
  axdarkauctions.schedulers:
    default: op
  axdarkauctions.start:
    default: op
  axdarkauctions.stop:
    default: op
  axdarkauctions.stopall:
    default: op
  axdarkauctions.join:
    default: true
  axdarkauctions.leave:
    default: true
  axdarkauctions.info:
    default: true
  axdarkauctions.forcejoin:
    default: op
  axdarkauctions.view:
    default: op
  axdarkauctions.reload:
    default: op
