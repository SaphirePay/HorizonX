[package]
name = "horizon_java"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-bukkit = { path = "../../sdk/horizon-bukkit" }
jrt = { path = "../runtime/jrt" }
jbridge = { path = "../runtime/jbridge" }
jni = "=0.21.1"
libloading = "0.8"
serde_json = "1"

[profile.release]
panic = "unwind"
opt-level = 2
codegen-units = 16

[workspace]
